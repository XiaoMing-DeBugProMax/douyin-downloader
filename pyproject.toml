[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "douyin-local-downloader"
version = "0.1.0"
description = "Windows-only localhost downloader for one authorized public Douyin video"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.140.7",
  "uvicorn==0.51.0",
  "httpx==0.27.2",
  "pydantic==2.9.2",
  "f2==0.0.1.7",
  "pillow>=12,<13",
  "pystray==0.19.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "playwright>=1.55,<2",
  "ruff>=0.14,<1",
  "mypy>=1.18,<2",
  "pyinstaller>=6.16,<7",
]

[project.scripts]
douyin-local-downloader = "douyin_downloader.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/douyin_downloader"]

[tool.hatch.build]
include = ["src/douyin_downloader/web/static/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: explicit real-network Douyin verification"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["douyin_downloader"]
