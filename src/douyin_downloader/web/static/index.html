<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>抖音视频下载</title>
  </head>
  <body>
    <main>
      <h1>抖音视频下载</h1>
      <p>本地运行，仅支持你有权下载的单个公开视频。</p>
      <form id="parse-form">
        <label for="share-text">分享文案或链接</label>
        <textarea id="share-text" required maxlength="2000"></textarea>
        <button id="parse-button" type="submit">解析</button>
      </form>
      <p id="status" aria-live="polite"></p>
      <p id="error" aria-live="assertive"></p>
      <section id="result" hidden>
        <img id="video-cover" alt="视频封面">
        <h2 id="video-author"></h2>
        <p id="video-description"></p>
        <p id="video-duration"></p>
        <button id="default-download" type="button">下载视频</button>
        <button id="save-to-location" type="button">选择保存位置</button>
      </section>
    </main>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
