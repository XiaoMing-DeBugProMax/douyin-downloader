<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>抖音视频下载</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <header class="site-header">
      <a class="brand" href="/" aria-label="抖音视频下载首页">
        <span class="brand-mark" aria-hidden="true">D</span>
        <span>抖音视频下载</span>
      </a>
      <div class="header-tools">
        <span class="local-badge"><span aria-hidden="true"></span>仅本机运行</span>
        <div class="theme-picker">
          <button
            id="theme-button"
            class="theme-button"
            type="button"
            aria-label="切换颜色主题"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="theme-menu"
          >
            <span class="theme-dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <span>主题</span>
          </button>
          <div id="theme-menu" class="theme-menu" role="menu" aria-label="颜色主题" hidden>
            <button type="button" role="menuitemradio" data-theme="light" aria-checked="true">
              <span class="theme-swatch swatch-light" aria-hidden="true"></span>
              <span><strong>明亮简洁</strong><small>清爽日常</small></span>
            </button>
            <button type="button" role="menuitemradio" data-theme="dark" aria-checked="false">
              <span class="theme-swatch swatch-dark" aria-hidden="true"></span>
              <span><strong>深色抖音感</strong><small>高对比夜间</small></span>
            </button>
            <button type="button" role="menuitemradio" data-theme="calm" aria-checked="false">
              <span class="theme-swatch swatch-calm" aria-hidden="true"></span>
              <span><strong>冷静工具感</strong><small>沉稳专注</small></span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main id="main-content" class="page-shell" tabindex="-1">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">LOCAL VIDEO TOOL</p>
        <h1 id="page-title">把分享链接，变成一段视频。</h1>
        <p class="intro-copy">粘贴抖音分享文案或公开视频链接，在本机解析并下载。</p>
      </section>

      <form id="parse-form" class="parse-panel" novalidate>
        <label for="share-text">分享文案或链接</label>
        <div class="input-row">
          <textarea
            id="share-text"
            maxlength="2000"
            aria-describedby="input-hint error"
            aria-required="true"
            placeholder="例如：v.douyin.com/…"
          ></textarea>
          <button id="parse-button" class="button button-primary" type="submit">
            <span class="button-label">开始解析</span>
            <span class="button-arrow" aria-hidden="true">→</span>
          </button>
        </div>
        <p id="input-hint" class="input-hint">支持完整分享文案，也可以只粘贴抖音链接。</p>
      </form>

      <div class="feedback">
        <p id="status" role="status" aria-live="polite"></p>
        <p id="error" role="alert"></p>
      </div>

      <section id="result" class="result-card" aria-labelledby="result-title" hidden>
        <div class="cover-wrap">
          <img id="cover" alt="视频封面">
          <span class="format-badge">MP4</span>
        </div>
        <div class="result-content">
          <div class="result-heading">
            <p class="result-kicker">解析完成</p>
            <h2 id="result-title"><span id="author"></span></h2>
          </div>
          <p id="description" class="description"></p>
          <p id="tags" class="video-tags" hidden></p>
          <dl class="metadata">
            <div><dt>格式</dt><dd>MP4 视频</dd></div>
            <div><dt>时长</dt><dd id="duration"></dd></div>
          </dl>
          <div class="result-actions">
            <button id="download-default" class="button button-primary" type="button">
              下载视频
            </button>
            <button id="download-custom" class="button button-secondary" type="button">
              选择保存位置
            </button>
            <button id="parse-another" class="button button-quiet" type="button">
              解析其他视频
            </button>
          </div>
        </div>
      </section>

      <p class="usage-note">仅下载你拥有权利或已获授权的公开视频。</p>
    </main>

    <script src="/assets/app.js" defer></script>
  </body>
</html>
